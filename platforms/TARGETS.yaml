# UNFOLDIQ Platform Target Policy (1G.7) — version 1.0.0, verified 2026-10-03
#
# Canonical 1G.7 targets. This file owns UNFOLDIQ *production policy*
# (preferred defaults, accepted forms, safe-zone composition guidance).
# External platform truth is cited per field via sourceRefs — never invented.
# Base technical profiles stay canonical in platforms/<platform>/PROFILE.yaml
# and are REFERENCED here (baseProfile), never duplicated/shadowed.

version: 1.0.0
policyVersion: platform-policy-1.0.0
verifiedAt: "2026-10-03T00:00:00.000Z"

sources:
